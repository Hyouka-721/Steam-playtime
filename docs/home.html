<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbf7f1">
<title>Hyouka</title>
<!-- 门户专属图标：松鼠（不再是站内那只手柄）。文件名带源图哈希，换图就换名，不靠缓存刷新 -->
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-home-32-b51ad21c.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-home-b51ad21c.png">
<meta name="description" content="Hyouka 的个人主页 · 游戏时长与观影记录">
<!-- 第 137 轮：独立样式 / 脚本；绝不引用 index/watch 的版本化资源，避免 bump 牵连两页。
     rain.css / rain.js 是两页共用的氛围层（只读引用；rain.css 现 v=9，rain.js v=7）；
     data-theme="cream" 让浅色壁纸上的雨丝走中性暖灰褐描边（rain.css 的 cream 分支）。 -->
<link rel="stylesheet" href="rain.css?v=9">
<link rel="stylesheet" href="home.css?v=5">
</head>
<body>
<!-- 雨丝层：fixed 全屏，z=12，内容 .stage 抬到 z=13 之上 -->
<div id="rain-layer" aria-hidden="true"></div>
<main class="stage">
  <section class="card" aria-label="Hyouka 的主页">
    <!-- 头像（正中、无底框、放大一倍）+ 右侧图标列 -->
    <div class="hero">
      <img class="avatar" src="img/avatar-hyouka-b5c4c979.webp"
           alt="Hyouka 的头像：戴草帽的皮卡丘" width="300" height="300" decoding="async">
      <!-- 入口列：史蒂夫在上、小黄人在下，位于头像正右侧；无框无文字 -->
      <nav class="entries" aria-label="站点入口">
        <a class="entry" href="index.html?stay=1" aria-label="进入 Game Time 游戏时长统计">
          <img src="img/steve-ceb15b8a.webp" alt="史蒂夫" width="400" height="386" decoding="async">
        </a>
        <a class="entry" href="watch.html" aria-label="进入 Watch List 观影记录">
          <img src="img/minion-0ef9a202.webp" alt="小黄人" width="460" height="420" decoding="async">
        </a>
      </nav>
    </div>

    <!-- 昵称 + 随机诗句 -->
    <h1 class="name">Hyouka</h1>
    <blockquote class="quote" id="home-quote" role="button" tabindex="0"
                aria-label="点诗句换一句，双击作者可点踩">加载中…</blockquote>
  </section>
</main>

<script src="poems.js?v=5"></script>
<script src="home.js?v=5"></script>

<!-- 第 137 轮：复用两页共用雨效（rain.js v=7）。主页没有氛围开关，默认下雨；
     若用户在其它页把氛围设为「关」（ambience.mode === 'off'）则主页也不下，保持一致。
     rain.js 是 async 引入，可能晚到 → 轻量轮询等 window.__rain 就绪后再 set(true)。 -->
<script src="rain.js?v=7" async fetchpriority="low"></script>
<script>
(function () {
  'use strict';
  var off = false;
  try { off = localStorage.getItem('ambience.mode') === 'off'; } catch (e) {}
  if (off) return;                       /* 尊重用户在其它页的「关」设置 */
  var tries = 0;
  (function boot() {
    if (window.__rain) { window.__rain.set(true); return; }   /* rain.js 内部会再滤 prefers-reduced-motion */
    if (++tries > 150) return;           /* 约 12s 兜底，避免无限轮询 */
    setTimeout(boot, 80);
  })();
})();
</script>
</body>
</html>
